[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "harness-tool"
version = "0.1.0"
description = "Wiring harness design tool - headless core"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "ulid-py>=1.1.0",
    "click>=8.1",
    "python-ulid>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
harness = "app.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["app", "library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
